services:

  redis:
    container_name: ytdl-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional containerised stack (the same two processes you run locally):
  #   docker compose up -d --build
  huey:
    build: .
    image: mst-ytdl
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies   # put an exported cookies.txt here (see README: Cookies)
    depends_on:
      redis: { condition: service_healthy }
    command: huey_consumer tasks.huey -k thread -w ${TASK_WORKERS:-6}

  app:
    build: .
    image: mst-ytdl
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      PYTHONPATH: /app
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies   # put an exported cookies.txt here (see README: Cookies)
    depends_on:
      redis: { condition: service_healthy }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --timeout-graceful-shutdown 2

volumes:
  redis-data:
