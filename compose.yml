services:

  redis:
    container_name: ytdl-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional containerised stack (the same two processes you run locally):
  #   docker compose up -d --build
  huey:
    build: .
    image: mst-ytdl
    restart: unless-stopped
    env_file: [.env]
    ulimits: { nofile: { soft: 65536, hard: 65536 } }   # safety net; sockets are closed properly, but 1024 is tight for 6 parallel downloads
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      LOG_ROLE: worker
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs   # every log file of the stack lands in ./logs
      - ./cookies:/app/cookies   # put an exported cookies.txt here (see README: Cookies)
      # source code straight from the repo (read-only): a code change needs only `docker compose restart app huey`.
      # The venv / ffmpeg / Node stay in the image (/app/.venv is NOT mounted over) — rebuild only for new dependencies.
      - ./api:/app/api:ro
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
      - ./modules:/app/modules:ro
      - ./services:/app/services:ro
      - ./tasks:/app/tasks:ro
      - ./web:/app/web:ro
      - ./main.py:/app/main.py:ro
    depends_on:
      redis: { condition: service_healthy }
    command: huey_consumer tasks.huey -k thread -w ${TASK_WORKERS:-6}

  app:
    build: .
    image: mst-ytdl
    restart: unless-stopped
    env_file: [.env]
    ulimits: { nofile: { soft: 65536, hard: 65536 } }   # safety net; sockets are closed properly, but 1024 is tight for 6 parallel downloads
    environment:
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      PYTHONPATH: /app
      LOG_ROLE: api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies   # put an exported cookies.txt here (see README: Cookies)
      - ./logs:/app/logs
      # source code straight from the repo (read-only): a code change needs only `docker compose restart app huey`.
      # The venv / ffmpeg / Node stay in the image (/app/.venv is NOT mounted over) — rebuild only for new dependencies.
      - ./api:/app/api:ro
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
      - ./modules:/app/modules:ro
      - ./services:/app/services:ro
      - ./tasks:/app/tasks:ro
      - ./web:/app/web:ro
      - ./main.py:/app/main.py:ro
    depends_on:
      redis: { condition: service_healthy }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --timeout-graceful-shutdown 2

volumes:
  redis-data:
